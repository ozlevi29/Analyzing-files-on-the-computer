ShortDescription: Explains why your PC is slow and what you can safely delete, before every action.
Description: >-
  PC Doctor scans Windows for the causes of slowness (full disk, memory, startup programs, extra antivirus, power settings,
  network) and lists steps to fix them. Every step explains exactly which folders are affected, what will not be harmed,
  and how to undo it. Cleanups can be kept in a 7-day quarantine so they can be restored. Free and open source, English and Hebrew.
